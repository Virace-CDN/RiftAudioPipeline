name: Pipeline Dispatch

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "结构化 dispatch payload JSON 字符串；完整 schema 与手动调用示例见 README.md"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pipeline-dispatch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RIFT_CONTROL_PLANE_BASE_URL: ${{ vars.RIFT_CONTROL_PLANE_BASE_URL }}
      RIFT_CONTROL_PLANE_BEARER_TOKEN: ${{ secrets.RIFT_CONTROL_PLANE_BEARER_TOKEN }}
      RIFT_CONTROL_PLANE_ACCESS_CLIENT_ID: ${{ secrets.RIFT_CONTROL_PLANE_ACCESS_CLIENT_ID }}
      RIFT_CONTROL_PLANE_ACCESS_CLIENT_SECRET: ${{ secrets.RIFT_CONTROL_PLANE_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Write dispatch payload
        env:
          DISPATCH_PAYLOAD_JSON: ${{ github.event.inputs.payload }}
        run: |
          printf '%s' "$DISPATCH_PAYLOAD_JSON" > "$RUNNER_TEMP/dispatch-payload.json"
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          from rift_audio_pipeline.control_plane.workflow_dispatch import (
              redact_raw_dispatch_payload,
          )

          raw_payload = json.loads(os.environ["DISPATCH_PAYLOAD_JSON"])
          redacted_path = Path(os.environ["RUNNER_TEMP"]) / "dispatch-payload.redacted.json"
          redacted_path.write_text(
              json.dumps(redact_raw_dispatch_payload({"ref": "${{ github.ref_name }}", "inputs": {"payload": os.environ["DISPATCH_PAYLOAD_JSON"]}}), ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Run pipeline
        run: >
          uv run python -m rift_audio_pipeline.control_plane.job_runner
          --ref "${{ github.ref_name }}"
          --dispatch-inputs-file "$RUNNER_TEMP/dispatch-payload.json"
          --storage-root "$RUNNER_TEMP/rift-control-plane"
          --output-root "output"
          --temp-root "temp"
          --log-root "output/logs"
          --control-plane-base-url "$RIFT_CONTROL_PLANE_BASE_URL"
          --control-plane-bearer-token "$RIFT_CONTROL_PLANE_BEARER_TOKEN"
          --control-plane-access-client-id "$RIFT_CONTROL_PLANE_ACCESS_CLIENT_ID"
          --control-plane-access-client-secret "$RIFT_CONTROL_PLANE_ACCESS_CLIENT_SECRET"

      - name: Write Output Tree
        if: always()
        run: |
          if [ -d output ]; then
            find output -print | sort > "$RUNNER_TEMP/output-tree.txt"
          else
            printf 'output not found\n' > "$RUNNER_TEMP/output-tree.txt"
          fi

      - name: Sanitize Runtime Artifact
        if: always()
        run: |
          find "$RUNNER_TEMP/rift-control-plane" -type f -name 'baidu-token.json' -delete 2>/dev/null || true
          rm -f "$RUNNER_TEMP/dispatch-payload.json"

      - name: Upload Runtime Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-runtime-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            output/logs
            ${{ runner.temp }}/output-tree.txt
            ${{ runner.temp }}/rift-control-plane
            ${{ runner.temp }}/dispatch-payload.redacted.json
