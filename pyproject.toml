[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "rift-audio-pipeline"
version = "0.1.0"
description = "LOL 语音资源自动化流水线"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx==0.28.1",
    "loguru==0.7.3",
    "python-dateutil==2.9.0.post0",
    "riotmanifest==2.2.1",
    "urllib3==2.6.3",
    "lol-audio-unpack @ git+https://github.com/Virace/lol_extract_voice.git@v3-test",
]

[project.scripts]
rift-audio-pipeline = "rift_audio_pipeline.cli:main"
rift-baidu-oauth = "rift_audio_pipeline.baidu.cli:main"
rift-diff-collect = "rift_audio_pipeline.workflows.diff_cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rift_audio_pipeline"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "third_party/baidu_sdk",
    "third_party/baidu_sdk/openapi_client",
]

[tool.ruff.format]
quote-style = "double"
