[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "rift-audio-pipeline"
version = "0.1.0"
description = "LOL 语音资源自动化流水线"
requires-python = ">=3.13"
dependencies = [
    "loguru==0.7.3",
    "python-dateutil==2.9.0.post0",
    "riotmanifest==2.4.0",
    "urllib3==2.6.3",
    "lol-audio-unpack @ git+https://github.com/Virace/lol_extract_voice.git@v3-test",
]

[project.scripts]
rift-baidu-oauth = "rift_audio_pipeline.baidu.cli:main"
rift-audio-pipeline = "rift_audio_pipeline.pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rift_audio_pipeline"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "third_party/baidu_sdk",
    "third_party/baidu_sdk/openapi_client",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
markers = [
    "real_data: 需要联网并使用本地缓存的真实链路测试",
]
